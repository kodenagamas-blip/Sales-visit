function visit(s){gps(c=>{let n=prompt("Keterangan kunjungan:","")||"";let inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.capture="environment";inp.onchange=()=>{let f=inp.files[0];if(!f){saveVisit(c,n,"");return}let r=new FileReader();r.onload=()=>saveVisit(c,n,r.result);r.readAsDataURL(f)};inp.click();function saveVisit(c,n,photo){let d=s.lat!=null?dist(c.latitude,c.longitude,s.lat,s.lng):null,z=new Date();db.visits.push({date:z.toLocaleDateString("id-ID"),time:z.toLocaleString("id-ID"),sales:me.name,store:s.name,address:s.address,lat:c.latitude,lng:c.longitude,accuracy:c.accuracy,distance:d==null?"":d.toFixed(3),note:n,photo:photo});save();alert("Kunjungan berhasil dicatat.");render()}})}
function admin(){
 head("Admin Dashboard",`<div class="stats"><div>Total Toko<b>${db.stores.length}</b></div><div>Total Kunjungan<b>${db.visits.length}</b></div><div>Sales<b>${db.users.filter(x=>x.role=="sales").length}</b></div></div><div class="tabs"><button onclick="addStoreForm()">➕ Input Toko</button><button onclick="aStores()">🏪 Toko</button><button onclick="aVisits()">📋 Kunjungan</button><button onclick="aSales()">👤 Sales</button><button onclick="csv()">⬇️ Export</button></div><div id="AC" class="card">Pilih menu di atas.</div>`)
}
function addStoreForm(){
 AC.innerHTML=`<h3>➕ Input Toko Baru</h3>
 <input id="SN" placeholder="Nama toko *">
 <input id="SA" placeholder="Alamat toko">
 <input id="SK" placeholder="Kecamatan / Kota">
 <input id="SC" placeholder="Kode toko">
 <select id="SS"><option value="">Pilih Sales</option>${db.users.filter(x=>x.role=="sales").map(x=>`<option value="${e(x.name)}">${e(x.name)}</option>`).join("")}</select>
 <textarea id="SD" placeholder="Keterangan toko" rows="4"></textarea>
 <label class="file">📷 Foto toko <input id="SP" type="file" accept="image/*" capture="environment" onchange="previewPhoto(this)"></label>
 <div id="PV"></div>
 <button onclick="saveStore()">💾 Simpan Toko</button>
 <button class="light" onclick="gpsStore()">📍 Ambil GPS Toko</button>
 <div id="GPSINFO"></div>`;
 window.newGPS=null; window.newPhoto="";
}
function previewPhoto(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{window.newPhoto=r.result;PV.innerHTML=`<img src="${r.result}" class="photo">`};r.readAsDataURL(f)}
function gpsStore(){gps(c=>{window.newGPS={lat:c.latitude,lng:c.longitude};GPSINFO.innerHTML=`GPS: ${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)}`})}
function saveStore(){
 if(!SN.value.trim())return alert("Nama toko wajib diisi.");
 let s={name:SN.value.trim(),address:SA.value.trim(),kec:SK.value.trim(),code:SC.value.trim(),sales:SS.value,desc:SD.value.trim(),photo:window.newPhoto||"",lat:window.newGPS?.lat??null,lng:window.newGPS?.lng??null};
 db.stores.unshift(s);save();alert("Toko berhasil disimpan.");aStores();
}
function aStores(){AC.innerHTML=`<h3>Master Toko (${db.stores.length})</h3><input id="AQ" placeholder="Cari toko..." oninput="aList()"><div id="AL"></div>`;aList()}
function aList(){let q=(AQ?.value||"").toLowerCase(),a=db.stores.filter(x=>(x.name+" "+x.address+" "+x.kec+" "+(x.desc||"")).toLowerCase().includes(q)).slice(0,100);AL.innerHTML=a.map((x,i)=>`<div class="card">${x.photo?`<img src="${x.photo}" class="photo">`:""}<b>${e(x.name)}</b><br><small>${e(x.address)} · ${e(x.kec)}</small>${x.desc?`<p>${e(x.desc)}</p>`:""}${x.sales?`<small>Sales: ${e(x.sales)}</small>`:""}<button onclick="setgps(${db.stores.indexOf(x)})">📍 Ambil GPS Toko</button></div>`).join("")}
function setgps(i){gps(c=>{db.stores[i].lat=c.latitude;db.stores[i].lng=c.longitude;save();alert("GPS toko disimpan.");aStores()})}
function aVisits(){AC.innerHTML=`<h3>Riwayat Kunjungan</h3><div class=scroll><table><tr><th>Waktu</th><th>Sales</th><th>Toko</th><th>Jarak</th><th>Catatan</th></tr>${db.visits.slice().reverse().map(x=>`<tr><td>${e(x.time)}</td><td>${e(x.sales)}</td><td>${e(x.store)}</td><td>${e(x.distance)}</td><td>${e(x.note)}</td></tr>`).join("")}</table></div>`}
function aSales(){AC.innerHTML=`<h3>Akun Sales</h3><small>Password awal semua sales: 123456</small><table>${db.users.filter(x=>x.role=="sales").map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.u)}</td></tr>`).join("")}</table>`}
function csv(){let r=[["Tanggal","Waktu","Sales","Toko","Alamat","Lat","Lng","Akurasi","Jarak KM","Catatan"],...db.visits.map(x=>[x.date,x.time,x.sales,x.store,x.address,x.lat,x.lng,x.accuracy,x.distance,x.note])],s=r.map(a=>a.map(x=>`"${String(x??"").replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download="kunjungan.csv";a.click()}
loginPage()
</script></body></html>
